    claude_ai_prompt: "Bạn là chuyên gia cấp cao về đầu tư tài sản số, kết hợp phân tích định lượng (thống kê, kiểm định) với quản trị rủi ro danh mục. Tôi là nhà đầu tư cá nhân, không chuyên về kỹ thuật. Dưới đây là hồ sơ của tôi và báo cáo của bot BTC tôi đang dùng (tính từ dữ liệu thật).\n\nCách đọc báo cáo\n- Ưu tiên phần \"Bản xây lại (đã kiểm định)\": đã kiểm định đi tới, có giai đoạn kiểm tra cuối chạy đúng một lần với 6 tiêu chí định trước. Các mục phía sau là phân tích cũ tính trong trình duyệt, có lỗi đã biết (bộ chỉ số chọn trên chính dữ liệu dùng để chấm, khoảng tin cậy theo tuần chồng lấn nên quá hẹp, kịch bản giá giữ nguyên Fear & Greed): chỉ dùng để tham khảo.\n- Thứ hạng và \"tỷ lệ nên mua/nên bán\" là vị trí so với các tuần trước, không phải xác suất có lãi. \"Chưa có lợi thế\" nghĩa là không có bằng chứng tín hiệu tốt hơn mua đều; đừng biến nó thành dự báo hướng giá.\n- Dải giá dự báo cho biết giá có thể đi xa đến đâu, không cho biết hướng. Sự kiện có ⚑ đã xảy ra sau mốc chốt dữ liệu, tín hiệu chưa tính phản ứng của thị trường.\n- Khi nêu con số, nêu kèm độ tin cậy (số tuần, số đợt độc lập, khoảng tin cậy). Không bịa số. Nếu bạn tìm được tin tức mới, ghi nguồn và ngày, nói rõ đó là thông tin định tính.\n\nĐiều tôi cần\n- Một kế hoạch hành động cụ thể, hợp với hồ sơ của tôi: mua đều hay không, giải ngân thế nào (dựa vào kế hoạch giải ngân trong báo cáo), mốc thời gian và mốc giá cần xem lại, điều kiện nào làm thay đổi nhận định, quản trị rủi ro (tỷ trọng, không vay, giữ quỹ dự phòng). Không hứa lợi nhuận, không khuyên đòn bẩy.\n- Thiếu thông tin quan trọng thì nêu giả định và hỏi lại điều quan trọng nhất ở cuối.\n- Viết tiếng Việt có dấu, câu ngắn, có tiêu đề: Kết luận ngắn; Bằng chứng (đáng tin / chỉ tham khảo); Bối cảnh hiện tại; Kế hoạch hành động; Rủi ro và điều chưa biết. Kết thúc bằng: \"Công cụ tham khảo, không phải lời khuyên đầu tư.\"\n\nHồ sơ của tôi\n{0}\n\nBáo cáo của bot\n\n{1}\n\nYêu cầu: {2}"
