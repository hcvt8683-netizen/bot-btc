    period: "mọi ngày gốc từ check_from đến ngày cuối đã biết kết quả k ngày"
    stats: "như mục entry: lợi trung bình, trung vị, phân vị 10%, tỷ lệ khớp, tỷ lệ chờ được giá tốt hơn, lợi trung bình hai nửa giai đoạn"
    ci: "như mục entry: bootstrap khối dừng (khối trung bình k ngày, 2000 lần, hạt giống 0), p hai phía, số đợt = số ngày chia k"
    verdict: "'Chờ có lợi hơn' khi p Holm trên 20 cấu hình < 0,05 và lợi trung bình > 0 ở cả hai nửa; 'Bán ngay tốt hơn' khi p Holm < 0,05 và < 0 ở cả hai nửa; còn lại 'chưa có lợi thế'"
    no_tuning: "chỉ báo cáo đủ 20 cấu hình, không chọn cấu hình tốt nhất để khuyên"
  # (C) Ngày nào có giá cao nhất trong 7 ngày tới
  highest_day:
    days: 7
