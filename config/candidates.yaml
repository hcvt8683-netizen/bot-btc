# Đăng ký trước cho Phần C (cố định TRƯỚC khi chạy; lưu git trước lần chạy đầu tiên). Không sửa sau khi xem kết quả;
# nếu buộc phải sửa, ghi lý do vào docs/REBUILD_LOG.md.
#
# Mô hình: hồi quy logistic L2 trên "độ rẻ" (phân vị 4 năm đã đổi chiều, 1 = rẻ nhất), chuẩn hóa bằng dữ liệu huấn luyện.
# Nhãn: giá đóng thứ Hai sau 26 tuần cao hơn giá đóng thứ Hai lúc mua. Ràng buộc dấu bên mua: mọi trọng số ≥ 0; chỉ số
# nào học ra trọng số âm thì bị loại khỏi bộ ở lần học đó (ghi lại), rồi học lại.
model:
  target_weeks: 26
  lambdas: [0.3, 1.0, 3.0]          # độ mạnh L2 (C = 1 / lambda)
  refit_weeks: 13                   # vòng ngoài: học lại mỗi 13 tuần, cửa sổ mở rộng
  min_train_weeks: 104              # số tuần có nhãn tối thiểu để học
  inner_valid_weeks: 52             # vòng trong: 52 tuần có nhãn gần nhất (cách phần học h tuần) để chọn bộ và lambda
  inner_metric: log_loss            # chọn cấu hình có log-loss thấp nhất; không cấu hình nào hơn tỷ lệ nền → không dùng mô hình
  rank_min_weeks: 52                # thứ hạng = vị trí của điểm hôm nay trong các điểm ngoài mẫu trước đó (cần ≥ 52 tuần)
  compare_multiplier: "0.5 + rank"  # chỉ để so sánh công bằng ở Phần C (hệ số thật làm ở Phần D)
  eval_end: 2023-12-31              # holdout từ 01/01/2024 khóa

sets:
  S1:
    features: [mvrv, p_200wma]
    why: "Giá so với giá vốn on-chain cộng xu hướng 4 năm; các đáy chu kỳ trước nằm quanh MA 200 tuần và MVRV dưới 1."
  S2:
    features: [mvrv, pi_ratio]
    why: "Lõi của bot hiện tại (PA1): định giá on-chain cộng chu kỳ trung bình 111/350 ngày."
  S3:
    features: [mvrv, puell]
    why: "Định giá cộng áp lực thợ đào: doanh thu phát hành thấp (thợ đào đầu hàng) thường trùng vùng đáy."
  S4:
    features: [mvrv, dev_ma20w]
    why: "Định giá cộng tâm lý đo bằng giá so với MA 20 tuần (giống Fear & Greed 0,89, có lịch sử từ 2010)."
  S5:
    features: [mvrv, fng]
    why: "Như S4 nhưng dùng Fear & Greed thật (chỉ có phân vị từ 02/2020, ít dữ liệu)."
  S6:
    features: [p_200wma, rsi_14w]
    why: "Xu hướng dài hạn cộng bán quá đà trên khung tuần."
  S7:
    features: [dd_ath, puell, dev_ma20w]
    why: "Điều kiện đầu hàng: giá giảm sâu từ đỉnh, thợ đào căng thẳng, tâm lý sợ hãi."
  S8:
    features: [pi_ratio, mvrv, fng]
    why: "Bộ bot đang dùng (PA3), để so trực tiếp."

baselines:
  dca: "Mua đều, hệ số 1,0"
  rule_mvrv: "Quy tắc 1 chỉ số: độ rẻ MVRV (phân vị 4 năm) làm điểm, không học"
  rule_p_200wma: "Quy tắc 1 chỉ số: độ rẻ Giá/MA 200 tuần làm điểm, không học"

tests:
  permutation_n: 1000
  permutation_min_shift_weeks: 52   # dịch vòng chuỗi tín hiệu so với chuỗi lợi suất, độ lệch ngẫu nhiên ≥ 52 tuần
  statistics: [ic_26w, cost_basis]  # tương quan thứ hạng với lợi suất 26 tuần; lợi thế giá vốn với hệ số 0,5 + thứ hạng
  multiple_testing: [max_statistic, holm]
  loco_cycles: ["2012-11-28/2016-07-08", "2016-07-09/2020-05-10", "2020-05-11/2023-12-31"]
  zone_order: [phai, cannhac, __baseline__, khong]   # không đơn điệu → gộp khung

# Phần D (đăng ký trước, lưu git trước khi chạy)
zones:
  thresholds: {phai: 80, cannhac: 60}   # theo thứ hạng 0–100 (cố định theo nguyên tắc dự án, không dò)
  hysteresis: 5                         # vào khung khi vượt ngưỡng; chỉ ra khi lùi quá ngưỡng 5 điểm
  rank_note: "Tỷ lệ nên mua là THỨ HẠNG của điểm tuần này trong các điểm ngoài mẫu trước đó, không phải xác suất có lãi."
multiplier:
  bounds: [0.5, 1.5]
  edge: win_diff_26w        # lợi thế của khung = tỷ lệ thắng 26 tuần của khung trừ mốc cùng giai đoạn
  use_bound: true           # dùng cận dưới (khung mua) hoặc cận trên (khung Không nên mua) của khoảng tin cậy, không dùng giá trị giữa
  scale: 2.0                # m = 1 + 2 × cận (ví dụ cận dưới +10 điểm % → 1,2); cận chứa 0 → 1,0
  min_episodes: 3           # khung dưới 3 đợt → 1,0
  refit_weeks: 13           # ước lượng lại lợi thế mỗi 13 tuần, chỉ bằng các tuần đã biết kết quả (đi tới)
  gate: part_i              # chỉ dùng hệ số khác 1,0 khi đạt TẤT CẢ tiêu chí Phần I; chưa đạt → 1,0 kèm lý do

# Phần E: bên bán, MỘT hệ thống (đăng ký trước, lưu git trước khi chạy)
sell:
  threshold_pct: 0.95             # tiêu chí bật khi chỉ số thuộc 5% đắt nhất của 4 năm trước (phân vị trượt, chỉ dữ liệu quá khứ)
  groups:                         # đếm đồng thuận theo nhóm, không theo từng chỉ số
    dinh_gia_onchain: [mvrv, mvrv_z]
    xu_huong_gia: [pi_ratio, mayer, p_200wma, rsi_14w]
    tho_dao: [puell]
    tam_ly: [fng, dev_ma20w]
  levels: {chot_mot_phan: 1, ban_phan_lon: 3}   # 0 nhóm → Giữ; 1–2 nhóm → Chốt lời một phần; ≥ 3 nhóm → Bán phần lớn
  triggers: [1, 3]                # thử: bán khi ≥ 1 nhóm bật, và khi ≥ 3 nhóm bật
  sell_fractions: [0.10, 0.20, 0.30]   # bán X% lượng BTC đang giữ, MỘT lần khi đợt tín hiệu bắt đầu (đợt: ngắt ≤ 4 tuần thì gộp)
  buyback:                        # mua lại toàn bộ tiền đã bán, khi điều kiện nào đến trước
    price_below_sale: 0.80        #  (a) giá đóng ≤ 80% giá bán bình quân
    max_weeks: 52                 #  (b) hoặc sau 52 tuần kể từ lần bán
  base: dca                       # nền: vẫn mua đều mỗi tuần; so với mua đều giữ nguyên (không bán)
  outcome_weeks: 26               # chấm từng tiêu chí: giá 26 tuần sau thấp hơn lúc bật (theo đợt, Wilson) và chênh so với mốc
  trusted_rule: "hoạt động ngoài mẫu ở ít nhất 2 chu kỳ gần nhất, có chu kỳ 2021–2025 (cần dữ liệu holdout, chấm ở Phần I)"

# Phần F: kịch bản giá động (đăng ký trước, lưu git trước khi chạy)
scenarios:
  price_changes: [-0.30, -0.20, -0.10, -0.05, 0.0, 0.05, 0.10, 0.20, 0.30, 0.50]
  weeks: [1, 2, 4]                  # giá đi tới mức giả định sau k tuần, theo đường đều trên thang log
  direct: "chỉ số tính từ giá (MVRV, MVRV Z, Pi, Mayer, MA 200 tuần, MA 20 tuần, RSI, biến động 30 ngày, giảm từ đỉnh, Puell) tính lại đúng từ đường giá giả định"
  hold_fixed: "vốn hóa thực, nguồn cung, số BTC phát hành mỗi ngày, hash rate giữ ở giá trị cuối (thay đổi rất chậm trong ≤ 4 tuần)"
  fng_model: "ΔF&G sau k tuần = a + b × lợi suất log k tuần + c × (F&G hiện tại − 50), bình phương nhỏ nhất trên dữ liệu đến ngày phân tích"
  band: [0.10, 0.90]                # khoảng dao động = phân vị 10% và 90% của phần dư
  fng_check: {fit_until: 2021-12-31, test: [2022-01-01, 2023-12-31]}   # kiểm ngoài mẫu: độ phủ của khoảng 10–90% (kỳ vọng ~80%)
  # Thêm sau lần chạy đầu (ghi trong docs/REBUILD_LOG.md): khoảng cho quy tắc MVRV và nhóm định giá bên bán theo thay đổi vốn hóa thực
  # trong k tuần (phân vị 10% và 90% của 208 tuần trước ngày phân tích). Trường hợp giữa vẫn giữ nguyên vốn hóa thực.
  rc_band: {window_weeks: 208, band: [0.10, 0.90]}

# Phần G: vĩ mô và sự kiện. Đăng ký trước khi chạy (29/10/2026).
macro:
  regime: "trần lãi suất Fed (FRED DFEDTARU) thay đổi trong 26 tuần trước: > +0,1 điểm % = tăng, < −0,1 = giảm, còn lại = giữ; chỉ dùng số liệu đến Chủ nhật đó; chỉ để chia nhóm khi báo cáo, không đưa vào mô hình"
  strategies: [pa3, nested, rule_mvrv, rule_200w]   # PA3 = bot hiện tại (Phần B, khung 80/60 không vùng trễ); 3 chiến lược của Phần D (khung có vùng trễ)
  horizon_main: 26          # bảng chính; các kỳ hạn 4/13/52 tuần ở phụ lục (file JSON)
  baseline: "mọi tuần cùng chế độ, cùng chiến lược, cùng giai đoạn (đến 31/12/2023)"
  regime_episodes: "các tuần liên tiếp cùng chế độ, khoảng hở ≤ 4 tuần gộp lại; đếm trong giai đoạn đánh giá của từng chiến lược"
  warn_below_episodes: 3    # chế độ hiện tại có dưới 3 đợt → cảnh báo rõ
  events:
    types: [fomc, cpi, pce, opex]   # lịch config/events.yaml; đáo hạn quyền chọn tính theo quy tắc thứ Sáu cuối tháng
    cutoff: "giá đóng Chủ nhật cuối cùng dùng để tính tín hiệu (23:59:59 UTC)"
    ahead_days: 7
    rule: "chỉ liệt kê sự kiện SAU mốc chốt dữ liệu; sự kiện giữa mốc chốt và lúc phát hành báo cáo được gắn cờ, đề nghị chạy lại sau giá đóng tuần kế tiếp; lịch thiếu ngày phủ tới hết cửa sổ thì cảnh báo"

# Phần H: kiểm định đi tới. Đăng ký trước khi chạy (29/10/2026).
forward:
  model: "mô hình lồng nhau (Phần C) đóng băng: chọn bộ chỉ số, λ và trọng số MỘT lần tại ngày đóng băng; không học lại trong thời gian theo dõi"
  also_logged: [rule_mvrv, rule_200w, sell]   # mốc so sánh và bên bán, ghi cùng dòng
  columns: [date, close, score, rank, zone, mult_rule, mult_used, model_version, rank_mvrv, zone_mvrv, rank_200w, zone_200w, sell_groups, sell_level, logged_at, late]
  hash: "sha256 của mã tính đầu ra (chuẩn hóa xuống dòng LF), các mục cấu hình model/sets/zones/multiplier/sell/rebuild, và trạng thái đóng băng (trọng số, lịch sử điểm để xếp hạng, khung tuần trước, ước lượng lợi thế từng khung, trạng thái cổng Phần I)"
  version_rule: "mã, cấu hình hoặc trạng thái đổi → không ghi tiếp; đóng băng lại thành phiên bản mới với nhật ký mới; nhật ký cũ giữ nguyên, chỉ thêm dòng, không sửa"
  late_rule: "dòng ghi sau giá đóng Chủ nhật kế tiếp → late = 1"
  score_horizons: [26, 52]
  score_rule: "chấm mọi dòng đã đủ kỳ hạn bằng giá đóng thứ Hai (như Phần B), cùng thước đo thống nhất; mốc = mọi tuần của nhật ký đã đủ kỳ hạn"
  real_freeze: "ngay sau lần chạy holdout duy nhất ở Phần I (đóng băng cần dữ liệu 2024–2026, làm sau để giữ khóa holdout)"
  dry_run: {freeze: 2022-12-25, log_until: 2023-12-31}   # chạy thử quy trình trên dữ liệu đã dùng ở Phần B–E; không phải kiểm định

# Phần I: tiêu chí chấp nhận và lần chạy holdout duy nhất. Đăng ký trước khi chạy (29/10/2026), trước khi đọc bất kỳ số nào của holdout.
acceptance:
  holdout_start: 2024-01-01          # đến tuần cuối có giá đóng thứ Hai trong dữ liệu lúc chạy
  model: "mô hình lồng nhau (Phần C) đi tới tiếp vào holdout: học lại mỗi 13 tuần, cửa sổ mở rộng, purge 26 tuần; thứ hạng ngoài mẫu, khung có vùng trễ và hệ số theo cận khoảng tin cậy (Phần D), chưa qua cổng"
  weeks: "chuỗi tuần liên tục từ tuần đầu có thứ hạng; tuần không có mô hình hoặc không có khung → hệ số 1,0 (mua đều)"
  multiplier: "quyết định bằng hệ số Phần D (thứ sẽ dùng thật nếu đạt). Chỉ để tham khảo, không quyết định: hệ số so sánh 0,5 + thứ hạng (Phần C)"
  criteria:
    c1: "lợi thế giá vốn (tiền thừa tính theo giá cuối) > 0 ở ≥ 75% số năm dương lịch ngoài mẫu trước holdout có ≥ 26 tuần, VÀ > 0 trên holdout"
    c2: "cận dưới khoảng tin cậy 95% (bootstrap khối dừng, khối 26 tuần, 2000 lần) của lợi thế giá vốn trên holdout > 0"
    c3: "trên holdout, p hoán vị đã hiệu chỉnh max-statistic trên mọi cấu hình đã thử (lồng nhau, 24 cấu hình cố định, 2 quy tắc) < 0,05 cho CẢ IC 26 tuần và lợi thế giá vốn theo hệ số so sánh (thống kê của Phần C); dịch vòng ≥ 52 tuần, 1000 lần, cùng hạt giống"
    c4: "khung đơn điệu (Phải mua ≥ Cân nhắc mua ≥ mốc ≥ Không nên mua) ở mọi kỳ hạn 4/13/26/52 tuần trên toàn bộ giai đoạn ngoài mẫu đến hết holdout, VÀ mọi trọng số ≥ 0 ở mọi lần học lại"
    c5: "Brier của xác suất mô hình < Brier của tỷ lệ gốc, trên các tuần holdout có mô hình và đã biết nhãn 26 tuần"
    c6: "lợi thế giá vốn trên holdout của mô hình > của TỪNG quy tắc đơn giản (MVRV, Giá/MA 200 tuần) với cùng cách tạo thứ hạng, khung và hệ số"
  pass: "đạt cả 6 → passed: true trong data/results/acceptance.json; thiếu dữ liệu để tính một tiêu chí → tiêu chí đó không đạt"
  sell:
    cycles: [[2016-07-09, 2020-05-10], [2020-05-11, 2024-04-19], [2024-04-20, null]]   # theo kỳ giảm một nửa; chu kỳ cuối đến hết dữ liệu
    trusted: "tiêu chí đúng nhiều hơn mốc (≥ 2 đợt, giá 26 tuần sau thấp hơn) ở CẢ hai chu kỳ gần nhất: 2020–2024 (đỉnh 2021) và 2024–nay (đỉnh 10/2025); cách đếm như Phần E"
  once: "chạy bằng `python -m bot.cli acceptance --final`, ghi vào experiments/final_runs.log; đã có một lần chạy thì lệnh từ chối; không sửa gì theo kết quả"
  rehearsal: {holdout_start: 2022-01-01, data_end: 2023-12-31}   # diễn tập cùng mã trên dữ liệu đã xem, để bắt lỗi trước lần chạy thật

# Kế hoạch giải ngân một khoản tiền (tính năng web). Đăng ký trước khi tính bất kỳ con số nào (29/10/2026).
plan:
  options_weeks: [1, 4, 13, 26, 52]   # 1 = giải ngân hết một lần; còn lại chia đều mỗi thứ Hai trong N tuần
  horizon_weeks: 52                   # so giá trị 52 tuần sau lần mua đầu; tiền chưa mua giữ nguyên, lãi 0%
  data_from: 2016-07-09               # 3 chu kỳ gần nhất (từ kỳ giảm một nửa 2016); toàn bộ từ 2012-11-28 chỉ ghi thêm để tham khảo
  data_from_full: 2012-11-28
  execution: "mua ở giá đóng thứ Hai (như Phần B), phí và trượt giá như bot"
  best_roi: "phương án có trung vị lợi nhuận sau 52 tuần cao nhất"
  rule: "đề xuất = trong phương án ROI cao nhất và các phương án không kém nó đáng kể (khoảng tin cậy 95% của trung vị chênh lệch theo từng tuần bắt đầu, bootstrap khối 52 tuần, chứa 0), chọn phương án có phân vị 10% cao nhất (ít thiệt nhất khi gặp lúc xấu)"
  signals: "không nghiêng theo tín hiệu: kiểm định 6 tiêu chí (Phần I) không đạt, nên mọi phương án chia đều theo thời gian"
  episodes: "số đợt độc lập = số tuần bắt đầu chia 52 (các cửa sổ 1 năm chồng lấn); Wilson tính theo số đợt"

# Kế hoạch chốt lời dần (bên bán, đối xứng mục plan): bán một lượng BTC theo từng đợt. Đăng ký trước khi tính (02/11/2026, người dùng yêu cầu).
sell_plan:
  why: "ở chế độ Bên bán, người dùng muốn biết nên bán một lượng BTC một lần hay chia thành nhiều đợt, như Giải ngân của bên mua"
  options_weeks: [1, 4, 13, 26, 52]   # 1 = bán hết một lần; còn lại chia đều số BTC, bán mỗi thứ Hai trong N tuần
  horizon_weeks: 52                   # đọc kết quả 52 tuần sau lần bán đầu (mọi phương án đã bán hết)
  data_from: 2016-07-09               # như mục plan; toàn bộ từ 2012-11-28 chỉ ghi thêm để tham khảo
  data_from_full: 2012-11-28
  execution: "bán ở giá đóng thứ Hai (như mục plan), nhận giá × (1 − trượt giá) rồi trừ phí, phí và trượt giá như bot; tiền đã thu giữ nguyên, lãi 0%"
