# Dự báo xu hướng: tăng hay giảm, bao nhiêu, ở 1–7 ngày, 1–4 tuần, 1–6 tháng. Đăng ký trước khi tính bất kỳ con số nào (02/11/2026).
trend:
  why: "người dùng muốn một thẻ cho biết giá đang có xu hướng tăng hay giảm, tăng / giảm bao nhiêu, ở nhiều kỳ hạn, chính xác nhất có thể, từ nhiều mô hình toán độc lập và đối chiếu với các thẻ khác. Các nghiên cứu trước chưa tìm được lợi thế về hướng giá, nên mục này chấm từng mô hình so với tỷ lệ gốc và chỉ nói Tăng / Giảm theo một mô hình khi nó thắng tỷ lệ gốc chắc chắn"
  known_before: "đã biết trước: tín hiệu tuần (Phần I) đạt 0/6 tiêu chí; xác suất có lãi 1, 3, 6, 12 tháng chưa cách nào thắng tỷ lệ gốc; Long/Short 1–24 giờ, 1–7 ngày chưa có lợi thế; dải giá chia độ dao động trúng đúng tỷ lệ"
  price: "giá đóng ngày Coin Metrics (như mục forecast); ngày gốc T = ngày cuối có giá"
  horizons_days: [1, 2, 3, 4, 5, 6, 7, 14, 21, 28, 30, 60, 90, 120, 150, 180]   # 1–7 ngày; 1–4 tuần; 1–6 tháng (1 tháng = 30 ngày)
  target: "lợi suất log k ngày r = log(giá đóng T + k / giá đóng T); tăng khi r > 0"
  scale: "z = r / (độ lệch chuẩn lợi suất log ngày của 30 ngày đến T × √k), như mục forecast; phân vị của z nhân lại với độ dao động hiện tại"
  window_days: 1461   # mọi ước lượng chỉ dùng các cửa sổ i đã biết kết quả (i + k ≤ T) trong 4 năm trước T
  quantiles: [0.10, 0.50, 0.90]
  models:
    goc: "tỷ lệ gốc (mốc): P(tăng) = tỷ lệ z > 0; phân vị 10/50/90% của z; trên mọi cửa sổ đã biết trong 4 năm"
    dong_luong: "động lượng: trạng thái = dấu lợi suất L ngày vừa qua (L = k nếu k ≥ 7, L = 7 nếu k < 7)"
    ma200: "xu hướng dài: giá đóng trên hay dưới (hoặc bằng) trung bình 200 giá đóng gần nhất"
    dinh_gia: "định giá: MVRV xếp hạng phân vị trong toàn bộ lịch sử trước đó (không gồm ngày đó, cần ít nhất 365 ngày); 3 nhóm: dưới 1/3, giữa, từ 2/3 trở lên"
    dao_chieu: "đảo chiều ngắn hạn: lợi suất log 7 ngày vừa qua chia (độ dao động 30 ngày × √7), xếp hạng trong 4 năm trước (không gồm ngày đó); 3 nhóm: 20% thấp nhất, giữa, 20% cao nhất"
    ket_hop: "kết hợp: trung bình cộng P(tăng) và trung bình cộng phân vị z của 4 mô hình có điều kiện (trọng số bằng nhau, không học)"
  conditional: "mô hình có điều kiện: chỉ dùng các cửa sổ đã biết có cùng trạng thái (trạng thái của cửa sổ tính ở ngày của nó). P(tăng) = (số cửa sổ cùng trạng thái có z > 0 + 20 × P_goc) / (số cửa sổ cùng trạng thái + 20); phân vị z từ các cửa sổ cùng trạng thái nếu có ít nhất 100, không thì dùng của goc"
  label: "Tăng khi P(tăng) ≥ 55%, Giảm khi P(tăng) ≤ 45%, còn lại 'Không rõ hướng'. Mức tăng / giảm = trung vị; khoảng 80% = phân vị 10–90%"
  eval_from: 2016-01-01
  eval: "đi tới mỗi ngày từ eval_from đến ngày cuối đã biết kết quả: Brier của P(tăng) và điểm phân vị (10/50/90 trên lợi suất log) của từng mô hình so với goc; tỷ lệ đoán đúng hướng (P(tăng) > 50% → tăng) so với goc; độ phủ khoảng 80%. Mức cải thiện so với goc: bootstrap khối dừng (độ dài khối trung bình k ngày, 4000 lần, hạt giống 0); p một phía = tỷ lệ mức cải thiện bootstrap ≤ 0 (tối thiểu 1/4000); hai nửa chia ở ngày giữa"
  verdict: "hướng: một mô hình có lợi thế ở kỳ hạn k khi p đã hiệu chỉnh Holm trên 5 mô hình × 16 kỳ hạn < 0,05 và Brier tốt hơn goc ở cả hai nửa; nhiều mô hình đạt thì lấy mô hình cải thiện nhiều nhất. Biên độ (phân vị): cùng cách với điểm phân vị, Holm riêng. Không mô hình nào đạt thì dùng goc và trang ghi 'chưa có lợi thế'"
  page: "giá lúc tra (trực tiếp) làm mốc; trạng thái, độ dao động, phân vị tính ở giá đóng ngày gần nhất. Mỗi kỳ hạn: hướng, P(tăng), mức tăng / giảm trung vị và khoảng 80%, mô hình đang dùng, số mô hình cùng chiều; bảng P(tăng) của mọi mô hình; đối chiếu với thẻ Dự báo (dải giá 1–7 và 30 ngày), Xác suất có lãi (4, 13, 26 tuần) và Long/Short; bảng kiểm tra lịch sử từng kỳ hạn"
  log: "mỗi ngày ghi một lần vào data/trend/trend_log.csv (chỉ thêm dòng, không ghi bù, chỉ kỳ hạn chưa tới) P(tăng) của mọi mô hình và phân vị của mô hình đang dùng, theo phiên bản; chấm khi đủ kỳ hạn"
  no_advice: "công cụ tham khảo, không phải lời khuyên đầu tư"

