[project]
name = "bot-btc"
version = "2.0.0"
description = "Bot thống kê mua bán BTC (chỉ tham khảo, không đặt lệnh)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pyarrow>=15", "ruamel.yaml>=0.18"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.45", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
