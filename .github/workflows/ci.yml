# Kiểm tra mỗi lần đẩy mã hoặc mở pull request; dựng trang và để lại bản tải về (artifact) để duyệt.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Cài thư viện
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Kiểm tra (đơn vị, ảnh chụp báo cáo và giao diện, không gọi mạng)
        run: make test
      - name: Dựng trang
        run: python build.py --site
      - name: Bản trang web để duyệt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trang-web-${{ github.sha }}
          path: site/
          include-hidden-files: true
          retention-days: 30
