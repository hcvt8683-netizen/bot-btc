# Quay lại một phiên bản cũ của trang (mặc định: v1-before-upgrade, bản trước nâng cấp). Chạy tay trong thẻ Actions.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Thẻ, nhánh hoặc commit cần đăng lại"
        required: true
        default: v1-before-upgrade

concurrency:
  group: btc-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dựng trang của phiên bản đã chọn
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python build.py
          mkdir -p site && cp bot-xac-suat.html site/index.html && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
