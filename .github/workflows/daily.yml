# Chạy mỗi ngày lúc 01:00 UTC (08:00 giờ Việt Nam), sau khi nến ngày và nến tuần thứ Hai đóng lúc 00:00 UTC,
# và mỗi khi có mã mới đẩy lên main.
# Lịch chạy theo giờ UTC; giờ Việt Nam chỉ dùng để hiển thị. GitHub có thể chạy trễ vào giờ cao điểm.
# Một nguồn lỗi không làm hỏng cả lần chạy: bot dùng bản gần nhất, khuyến nghị về mua đều và trang hiện cảnh báo.
name: Daily

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]   # mã mới trên main được đăng ngay; lần lưu dữ liệu của bot (GITHUB_TOKEN) không kích hoạt lại

concurrency:
  group: btc-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # chỉ để lưu dữ liệu mới vào nhánh main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Cài thư viện
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Kiểm tra từng nguồn dữ liệu từ máy chủ GitHub
        run: python -m bot.cli check-sources | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tải dữ liệu và kiểm tra chất lượng (dữ liệu lỗi không được lưu)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # không bắt buộc: không có khóa thì dùng CSV công khai
        run: python -m bot.cli fetch || echo "⚠ Một số nguồn lỗi; dùng bản gần nhất, khuyến nghị về mua đều." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dựng bảng chỉ số
        run: python -m bot.cli features
      - name: Khuyến nghị tuần
        run: python -m bot.cli report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dựng trang
        run: python build.py --site
      - name: Kiểm tra
        run: make test
      - name: Lưu dữ liệu mới
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/status.json data/recommendation.json data/features.parquet
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
          else
            git commit -m "data: cập nhật $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            git push
          fi
      - name: Gói trang để đăng
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: data
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
