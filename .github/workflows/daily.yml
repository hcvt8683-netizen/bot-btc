# Chạy mỗi ngày lúc 01:00 UTC (08:00 giờ Việt Nam), sau khi nến ngày và nến tuần thứ Hai đóng lúc 00:00 UTC,
# và mỗi khi có mã mới đẩy lên main.
# Lịch chạy theo giờ UTC; giờ Việt Nam chỉ dùng để hiển thị. GitHub có thể chạy trễ vào giờ cao điểm.
# Một nguồn lỗi không làm hỏng cả lần chạy: bot dùng bản gần nhất, khuyến nghị về mua đều và trang hiện cảnh báo.
name: Daily

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]   # mã mới trên main được đăng ngay; lần lưu dữ liệu của bot (GITHUB_TOKEN) không kích hoạt lại
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: btc-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # chỉ để lưu dữ liệu mới vào nhánh main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Cài thư viện
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Kiểm tra từng nguồn dữ liệu từ máy chủ GitHub
        run: python -m bot.cli check-sources | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tải dữ liệu và kiểm tra chất lượng (dữ liệu lỗi không được lưu)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # không bắt buộc: không có khóa thì dùng CSV công khai
        run: python -m bot.cli fetch || echo "⚠ Một số nguồn lỗi; dùng bản gần nhất, khuyến nghị về mua đều." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dựng bảng chỉ số
        run: python -m bot.cli features
      - name: Dự báo dải giá (mỗi ngày gốc ghi một lần, chỉ thêm dòng)
        run: python -m bot.cli forecast | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không ghi được dự báo giá hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Giá chờ mua và ngày rẻ nhất (mỗi ngày gốc ghi một lần, chỉ thêm dòng)
        run: python -m bot.cli entry | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không ghi được giá chờ mua hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Giá chờ bán và ngày có giá cao nhất (mỗi ngày gốc ghi một lần, chỉ thêm dòng)
        run: python -m bot.cli exit | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không ghi được giá chờ bán hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Long/Short hợp đồng vĩnh cửu (mỗi ngày gốc ghi một lần, chỉ thêm dòng)
        run: python -m bot.cli perp | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không ghi được nhật ký Long/Short hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Long/Short có giá vào, cắt lỗ, chốt lời (mỗi tháng ghi lựa chọn một lần, chỉ thêm dòng)
        run: python -m bot.cli perp-trade | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không tính được Long/Short có cắt lỗ hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Price action lúc này và xác suất chạm (mục Price action của thẻ Long/Short)
        run: python -m bot.cli pa-sheet | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không tính được price action hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mua giữ lâu dài (thẻ Price action)
        run: python -m bot.cli long-hold | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không tính được mua giữ lâu dài hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hỗ trợ / kháng cự theo khung (thẻ Price action)
        run: python -m bot.cli sr-levels | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không tính được hỗ trợ / kháng cự hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Khuyến nghị tuần
        run: python -m bot.cli report | tee -a "$GITHUB_STEP_SUMMARY"
      # Sau "Khuyến nghị tuần" và "Long/Short có giá vào": phần Đối chiếu của thẻ Xu hướng đọc calib.json và perp_trade.json của cùng ngày.
      - name: Dự báo xu hướng (mỗi ngày gốc ghi một lần, chỉ thêm dòng)
        run: python -m bot.cli trend | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Không ghi được dự báo xu hướng hôm nay." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Nhật ký đi tới (mỗi giá đóng Chủ nhật một dòng, mô hình đóng băng)
        run: |
          python -m bot.cli forward log | tee -a "$GITHUB_STEP_SUMMARY" || echo "⚠ Nhật ký đi tới không ghi được tuần này; dữ liệu khác vẫn cập nhật." | tee -a "$GITHUB_STEP_SUMMARY"
          python -m bot.cli forward score || true
      - name: Dựng trang
        run: python build.py --site
      - name: Kiểm tra
        run: make test
      - name: Lưu dữ liệu mới
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/status.json data/recommendation.json data/features.parquet data/endpoint_check.json data/forward data/forecast data/calib data/results/calib.json data/entry data/results/entry.json data/exit data/results/exit.json data/perp data/results/perp.json data/perp_trade data/results/perp_trade.json data/trend data/results/trend.json data/results/pa.json data/results/sr.json data/results/hold.json
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
          else
            git commit -m "data: cập nhật $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            # main có thể vừa có commit mới trong lúc chạy (ai đó đẩy code): ghép dữ liệu lên main mới rồi đẩy lại, tối đa 3 lần.
            # Xung đột thì không tự ghi đè (nhật ký chỉ thêm dòng không được mất dòng nào): báo lại, trang vẫn được đăng.
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "main vừa đổi; ghép dữ liệu hôm nay lên main mới (lần $i)"
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo "⚠ Dữ liệu hôm nay xung đột với main mới nên chưa lưu; trang vẫn được đăng. Chạy lại Daily để lưu." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
            echo "⚠ Không đẩy được dữ liệu sau 3 lần thử; trang vẫn được đăng." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Gói trang để đăng
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: data
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
